<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EdgeHealth">
  <title>EdgeHealth</title>
  <!-- Self-contained tile (brand accent #087f8c): readable on light and dark backgrounds and browser tabs. -->
  <rect width="64" height="64" rx="14" fill="#087f8c"/>
  <!-- Network signal -->
  <circle cx="44" cy="24" r="3" fill="#bdf2ea"/>
  <path d="M44 16a8 8 0 0 1 8 8M44 9a15 15 0 0 1 15 15" fill="none" stroke="#bdf2ea" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Heartbeat pulse -->
  <path d="M6 40h11l5-11 8 21 6-15 4 5h18" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
