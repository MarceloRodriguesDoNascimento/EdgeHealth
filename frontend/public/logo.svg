<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EdgeHealth">
  <title>EdgeHealth</title>
  <!-- White tile with the patch-cable blue (#1c3fab) of the interface: readable on the blue band and in browser tabs. -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <!-- Network signal -->
  <circle cx="44" cy="24" r="3" fill="#1c3fab"/>
  <path d="M44 16a8 8 0 0 1 8 8M44 9a15 15 0 0 1 15 15" fill="none" stroke="#1c3fab" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Heartbeat pulse -->
  <path d="M6 40h11l5-11 8 21 6-15 4 5h18" fill="none" stroke="#1c3fab" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
